name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Catches drift against the stx/craft APIs the app builds on. Types only,
      # so this needs no craft binary and runs on Linux.
      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun test

  native:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Provision native dependencies
        uses: pantry-pm/pantry/packages/action@165819b641dadb99710f8f33d3bc9c4018e555b8 # 165819b641dadb99710f8f33d3bc9c4018e555b8
        with:
          version: '0.11.128'
      - run: bun install --frozen-lockfile
      - name: Build and sign the self-contained app
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pantry run build
      - name: Verify the app signature
        run: codesign --verify --deep --strict dist/Barista.app
      - name: Verify native initialization, power, shutdown and relaunch
        run: bun run test:native
      - name: Verify the read-only distributable
        run: |
          task_volume=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$task_volume" dist/Barista-*.dmg
          trap 'hdiutil detach "$task_volume"; rmdir "$task_volume"' EXIT
          bun run test:native "$task_volume/Barista.app"

  site:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://barista.stacksjs.com
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build marketing page and documentation, verify links and assets
        run: bun run build:site
      - name: Upload the static site for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: barista-site
          path: storage/site
          if-no-files-found: error

  deploy-site:
    needs: [lint, test, native, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: website-production
      url: https://barista.stacksjs.com
    permissions:
      contents: read
    concurrency:
      group: barista-website-production
      cancel-in-progress: false
    env:
      SITE_URL: https://barista.stacksjs.com
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Check that this push is still the main branch head
        id: revision
        run: |
          git fetch --quiet --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer push superseded this deployment.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the dedicated website deploy identity
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 "$RUNNER_TEMP/barista-deploy"
          umask 077
          task_deploy_key="$RUNNER_TEMP/barista-deploy/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$task_deploy_key"
          ssh-keygen -y -f "$task_deploy_key" > "$task_deploy_key.pub"
          printf 'HCLOUD_SSH_KEY=%s\n' "$task_deploy_key" >> "$GITHUB_ENV"
      - name: Deploy marketing page and docs through Stacks ts-cloud
        if: steps.revision.outputs.current == 'true'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$HCLOUD_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          bun run deploy:site
      - name: Verify the live release against this build
        if: steps.revision.outputs.current == 'true'
        run: bun run verify:site
      - name: Retain the verified production artifact
        if: steps.revision.outputs.current == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: barista-site-production-${{ github.sha }}
          path: storage/site
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Remove the deploy identity
        if: always()
        run: rm -rf "$RUNNER_TEMP/barista-deploy"
