name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Catches drift against the stx/craft APIs the app builds on. Types only,
      # so this needs no craft binary and runs on Linux.
      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun test

  native:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Provision native dependencies
        uses: pantry-pm/pantry/packages/action@f2e40c971d83c63a81d91afd5ad4dc63780f8b0f # main
        with:
          version: '0.11.126'
      - run: bun install --frozen-lockfile
      - name: Build and sign the self-contained app
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pantry run build
      - name: Verify the app signature
        run: codesign --verify --deep --strict dist/Barista.app
      - name: Verify native initialization, power, shutdown and relaunch
        run: bun run test:native
      - name: Verify the read-only distributable
        run: |
          task_volume=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$task_volume" dist/Barista-*.dmg
          trap 'hdiutil detach "$task_volume"; rmdir "$task_volume"' EXIT
          bun run test:native "$task_volume/Barista.app"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build marketing page and documentation, verify links and assets
        run: bun run build:site
      - name: Upload the static site for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: barista-site
          path: storage/site
          if-no-files-found: error
