name: Release

# `bun run release:minor` (or :patch / :major) bumps the version, tags it and
# pushes. That tag drives everything below: build the signed app, then let the
# pantry action publish it to the GitHub release. Private icon hiding requires direct distribution.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barista-direct-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Select a version tag when running a release."; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease' > "$RUNNER_TEMP/barista-release-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/barista-release-state")" = true || { echo '::error::A stable release is immutable. Use Verify release to recheck it.'; exit 1; }
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pantry
        uses: pantry-pm/pantry/packages/action@f2e40c971d83c63a81d91afd5ad4dc63780f8b0f # main
        with:
          version: '0.11.126'

      - run: bun install --frozen-lockfile

      - name: Prevent an older tag from replacing the stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release-version.ts "$GITHUB_REF_NAME" "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"

      - name: Decrypt release environment with Buddy Env
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          umask 077
          test -n "$DOTENV_PRIVATE_KEY_PRODUCTION"
          printf 'DOTENV_PRIVATE_KEY_PRODUCTION=%s\n' "$DOTENV_PRIVATE_KEY_PRODUCTION" > "$RUNNER_TEMP/barista.env.keys"
          bunx --bun @stacksjs/buddy@0.75.299 env:decrypt --file .env.production --file-keys "$RUNNER_TEMP/barista.env.keys" --stdout --quiet > "$RUNNER_TEMP/barista-release.env"
          bun --env-file="$RUNNER_TEMP/barista-release.env" scripts/prepare-release.ts

      - name: Import the Developer ID signing identity
        uses: pantry-pm/pantry/packages/action@f2e40c971d83c63a81d91afd5ad4dc63780f8b0f # main
        with:
          version: '0.11.126'
          install: 'false'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ env.APPLE_APPLICATION_CERTIFICATE }}
          apple-signing-certificate-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify source
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw new Error("Release tag must match package.json")'
          bun run check

      - name: Build, sign and notarize the direct app
        run: |
          test -n "$APPLE_SIGNING_IDENTITY"
          test -s "$APPLE_NOTARY_API_KEY_PATH"
          test -n "$APPLE_NOTARY_API_KEY_ID"
          test -n "$APPLE_NOTARY_API_ISSUER"
          pantry run build
          codesign --verify --deep --strict dist/Barista.app
          xcrun stapler validate dist/Barista.app
          spctl --assess --type execute --verbose dist/Barista.app

      - name: Verify the packaged native app
        run: bun run test:native

      - name: Verify the read-only distributable
        run: |
          task_volume=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$task_volume" dist/Barista-*.dmg
          trap 'hdiutil detach "$task_volume"; rmdir "$task_volume"' EXIT
          bun run test:native "$task_volume/Barista.app"

      # Candidates are downloadable for qualification but never served by /latest.
      - name: Stage the release candidate
        uses: pantry-pm/pantry/packages/action@f2e40c971d83c63a81d91afd5ad4dc63780f8b0f # main
        with:
          version: '0.11.126'
          install: 'false'
          release: 'true'
          release-prerelease: 'true'
          release-files: |
            dist/Barista-${{ steps.version.outputs.version }}.dmg
            dist/update.json
          # Generate notes from git history — no committed CHANGELOG to maintain.
          release-changelog: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Qualify the updater against the published candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/verify-updater.ts "$GITHUB_REF_NAME"

      - name: Promote the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/release-version.ts "$GITHUB_REF_NAME" "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = "$GITHUB_REF_NAME"

      - name: Retain updater qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: barista-updater-${{ github.ref_name }}-${{ github.run_attempt }}
          path: storage/release-verification/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove decrypted release credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/barista.env.keys" "$RUNNER_TEMP/barista-release.env" "$RUNNER_TEMP/barista-notary.p8"
