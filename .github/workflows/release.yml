name: Release

# `bun run release:minor` (or :patch / :major) bumps the version, tags it and
# pushes. That tag drives everything below: build the signed app, then let the
# pantry action publish it to the GitHub release and the Mac App Store.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Installs deps.yaml (bun + the craft binary the build bundles into the
      # .app) and imports the Apple signing certificates into a temporary
      # keychain, exporting the identities the build reads.
      - name: Set up pantry and signing
        id: pantry
        uses: pantry-pm/pantry/packages/action@main
        with:
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          apple-signing-installer-certificate: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          apple-signing-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-provisioning-profile: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - name: Build and sign
        run: bun run build

      # Uploads the signed .pkg to App Store Connect, then publishes the GitHub
      # release with the .dmg and .pkg attached and notes from the changelog.
      - name: Publish
        uses: pantry-pm/pantry/packages/action@main
        with:
          install: 'false'
          release: 'true'
          release-files: |
            dist/Barista-${{ steps.version.outputs.version }}.dmg
            dist/Barista-${{ steps.version.outputs.version }}.pkg
            dist/update.json
          # Generate notes from git history — no committed CHANGELOG to maintain.
          release-changelog: auto
          release-app-store: 'true'
          release-app-store-bundle-id: com.stacksjs.barista
          release-app-store-version: ${{ steps.version.outputs.version }}
          release-app-store-build-number: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
