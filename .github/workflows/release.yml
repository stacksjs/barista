name: Release

# `bun run release:minor` (or :patch / :major) bumps the version, tags it and
# pushes. That tag drives everything below: build the signed app, then let the
# pantry action publish it to the GitHub release. Private icon hiding requires direct distribution.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Select a version tag when running a release."; exit 1 ;;
          esac

      # Installs deps.yaml (bun + the craft binary the build bundles into the
      # .app) and imports the Apple signing certificates into a temporary
      # keychain, exporting the identities the build reads.
      - name: Set up pantry and signing
        id: pantry
        uses: pantry-pm/pantry/packages/action@22b00e5f6ca39fb254071c59a2566f79dfe9d9e4 # v0.11.124
        with:
          version: '0.11.124'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ secrets.APPLE_APPLICATION_CERTIFICATE }}
          apple-signing-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - run: bun install --frozen-lockfile

      - name: Verify source
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw new Error("Release tag must match package.json")'
          bun run check

      - name: Build, sign and notarize the direct app
        env:
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_NOTARIZE_TEAM_ID: '3JJRNQW6B7'
        run: |
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_NOTARIZE_APPLE_ID"
          test -n "$APPLE_NOTARIZE_PASSWORD"
          pantry run build
          codesign --verify --deep --strict dist/Barista.app

      - name: Verify the packaged native app
        run: bun run test:native

      - name: Verify the read-only distributable
        run: |
          task_volume=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$task_volume" dist/Barista-*.dmg
          trap 'hdiutil detach "$task_volume"; rmdir "$task_volume"' EXIT
          bun run test:native "$task_volume/Barista.app"

      # Publish only after signed-app and read-only DMG verification.
      - name: Publish
        uses: pantry-pm/pantry/packages/action@22b00e5f6ca39fb254071c59a2566f79dfe9d9e4 # v0.11.124
        with:
          version: '0.11.124'
          install: 'false'
          release: 'true'
          release-files: |
            dist/Barista-${{ steps.version.outputs.version }}.dmg
            dist/update.json
          # Generate notes from git history — no committed CHANGELOG to maintain.
          release-changelog: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
