name: App Store

on:
  push:
    tags:
      - 'v*'
      - 'app-store/v*'
  workflow_dispatch:
    inputs:
      deliver:
        description: Upload a version tag to Apple (leave off to qualify main without delivery)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: barista-app-store
  cancel-in-progress: false

jobs:
  app-store:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the release source
        id: source
        env:
          REQUEST_DELIVERY: ${{ github.event_name == 'push' || inputs.deliver }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/app-store/v*) ;;
            refs/heads/main)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$REQUEST_DELIVERY" = false
              ;;
            *) echo '::error::Select a version tag to upload an App Store build.'; exit 1 ;;
          esac
          git merge-base --is-ancestor HEAD origin/main
          printf 'deliver=%s\n' "$REQUEST_DELIVERY" >> "$GITHUB_OUTPUT"

      - name: Verify the selected Apple upload toolchain
        run: |
          xcodebuild -version
          xcrun altool --version

      - name: Set up the Pantry runtime
        uses: pantry-pm/pantry/packages/action@165819b641dadb99710f8f33d3bc9c4018e555b8 # 165819b641dadb99710f8f33d3bc9c4018e555b8
        with:
          version: '0.11.128'
      - run: bun install --frozen-lockfile

      - name: Verify source and version
        id: version
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME.replace(/^app-store\//, "") !== `v${pkg.version}`) throw new Error("Release tag must match package.json")'
          bun -e 'console.log(`version=${(await Bun.file("package.json").json()).version}`)' >> "$GITHUB_OUTPUT"
          bun run check

      - name: Decrypt Store credentials with Buddy Env
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          umask 077
          test -n "$DOTENV_PRIVATE_KEY_PRODUCTION"
          printf 'DOTENV_PRIVATE_KEY_PRODUCTION=%s\n' "$DOTENV_PRIVATE_KEY_PRODUCTION" > "$RUNNER_TEMP/barista.env.keys"
          bunx --bun @stacksjs/buddy@0.75.299 env:decrypt --file .env.production --file-keys "$RUNNER_TEMP/barista.env.keys" --stdout --quiet > "$RUNNER_TEMP/barista-store.env"
          bun --env-file="$RUNNER_TEMP/barista-store.env" scripts/prepare-release.ts --app-store

      - name: Import Store signing identities and profile
        id: signing
        uses: pantry-pm/pantry/packages/action@165819b641dadb99710f8f33d3bc9c4018e555b8 # 165819b641dadb99710f8f33d3bc9c4018e555b8
        with:
          version: '0.11.128'
          install: 'false'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ env.APPLE_STORE_APPLICATION_CERTIFICATE }}
          apple-signing-installer-certificate: ${{ env.APPLE_STORE_INSTALLER_CERTIFICATE }}
          apple-signing-certificate-password: ${{ env.APPLE_STORE_CERTIFICATE_PASSWORD }}
          apple-signing-provisioning-profile: ${{ env.APPLE_STORE_PROVISIONING_PROFILE_BASE64 }}

      - name: Build and sign the sandboxed edition
        env:
          APPLE_STORE_SIGNING_IDENTITY: ${{ steps.signing.outputs.apple-signing-identity }}
          APPLE_STORE_INSTALLER_IDENTITY: ${{ steps.signing.outputs.apple-signing-installer-identity }}
          APPLE_STORE_PROVISIONING_PROFILE: ${{ steps.signing.outputs.apple-signing-provisioning-profile }}
        run: |
          export GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          pantry run build:app-store
          codesign --verify --deep --strict dist/app-store/Barista.app
          pkgutil --check-signature dist/app-store/Barista-*.pkg

      - name: Verify the packaged app under App Sandbox
        id: native
        env:
          BARISTA_STORE_ARTWORK_DIR: storage/release-verification/store-artwork
          BARISTA_STORE_SOURCE_REVISION: ${{ github.sha }}
        run: bun run test:native:store

      - name: Retain current Store screenshots and capture provenance
        uses: actions/upload-artifact@v7.0.2
        with:
          name: barista-store-artwork-v${{ steps.version.outputs.version }}
          path: storage/release-verification/store-artwork/
          if-no-files-found: error
          retention-days: 90

      - name: Validate and upload to App Store Connect
        if: steps.source.outputs.deliver == 'true'
        id: delivery
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP"
          task_package=(dist/app-store/Barista-*.pkg)
          test "${#task_package[@]}" -eq 1
          xcrun altool --validate-app "${task_package[0]}" --api-key "$APPLE_NOTARY_API_KEY_ID" --api-issuer "$APPLE_NOTARY_API_ISSUER"
          xcrun altool --upload-package "${task_package[0]}" --wait --api-key "$APPLE_NOTARY_API_KEY_ID" --api-issuer "$APPLE_NOTARY_API_ISSUER"

      - name: Prepare encrypted Store submission credentials
        if: steps.source.outputs.deliver == 'true'
        run: bun --env-file="$RUNNER_TEMP/barista-store.env" scripts/prepare-release.ts --submission

      - name: Process the uploaded build and submit when Apple compliance is approved
        if: steps.source.outputs.deliver == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BARISTA_STORE_ARTWORK_DIR: storage/release-verification/store-artwork
          BARISTA_STORE_SOURCE_REVISION: ${{ github.sha }}
          BARISTA_STORE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bun scripts/submit-store.ts

      - name: Retain the signed submission package
        if: always() && steps.native.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: barista-app-store-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/app-store/Barista-*.pkg
          retention-days: 14

      - name: Retain the Store release receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: barista-store-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/release-verification/app-store.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove decrypted Store credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/barista.env.keys" "$RUNNER_TEMP/barista-store.env" "$RUNNER_TEMP/barista-submission.p8" "$RUNNER_TEMP"/AuthKey_*.p8
